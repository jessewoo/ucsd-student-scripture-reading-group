<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCSD Student Scripture Reading Group</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf8f5;
    --card: #ffffff;
    --text: #2b2521;
    --muted: #6b6259;
    --accent: #8a5a3b;
    --accent-hover: #6f4830;
    --border: #e7e0d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1916;
      --card: #262220;
      --text: #f1ece6;
      --muted: #b3a99e;
      --accent: #d3a373;
      --accent-hover: #e3b88b;
      --border: #3a332d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 8px;
    line-height: 1.3;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 28px;
  }
  .cta {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 1rem;
    transition: background 0.15s ease;
  }
  .cta:hover { background: var(--accent-hover); }
  .footer {
    margin-top: 28px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .footer a {
    color: var(--muted);
    text-decoration: underline;
  }
  .footer a:hover { color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>UCSD Student Scripture Reading Group</h1>
    <p class="subtitle">Join us as we read and discuss Scripture together.</p>
    <a class="cta" href="https://forms.gle/PyKgkWWVKs1LvNPi9" target="_blank" rel="noopener noreferrer">Sign Up</a>
    <p class="footer">
      Connected with <a href="https://wavchurch.org/wav-ucsd" target="_blank" rel="noopener noreferrer">WAV Church UCSD</a>
    </p>
  </div>
</body>
</html>
